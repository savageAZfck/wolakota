[package]
name = "wolakota"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/wolakota"
homepage = "https://github.com/savageAZfck/wolakota"
license = "MIT"
description = "Inter-organism treaties: cross-owner consent contracts between sovereign agents — dual-signed scopes, hash-chained treaty book, unilateral revocation — named for Lakota wolakota, peace between nations"
keywords = ["treaty", "consent", "sovereignty", "federation", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
